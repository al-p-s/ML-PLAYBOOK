<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="nb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6ea8fe"/></marker>
    <marker id="ng" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#8a8f98"/></marker>
  </defs>
  <rect x="1" y="1" width="758" height="288" rx="16" fill="#232426" stroke="#3a3c40"/>
  <line x1="380" y1="24" x2="380" y2="266" stroke="#3a3c40"/>

  <!-- до -->
  <text x="32" y="38" font-size="16" font-weight="600" fill="#e8e8e8">до</text>
  <text x="32" y="58" font-size="13" fill="#9a9fa6">t = (1, 2, 3)</text>
  <rect x="48" y="118" width="80" height="44" rx="8" fill="#1f3350" stroke="#6ea8fe" stroke-width="1.5"/>
  <text x="88" y="146" font-size="15" text-anchor="middle" fill="#cfe2ff">t</text>
  <path d="M128,140 L206,140" fill="none" stroke="#6ea8fe" stroke-width="2" marker-end="url(#nb)"/>
  <rect x="210" y="118" width="130" height="44" rx="8" fill="#4a3320" stroke="#f0a35e" stroke-width="1.5"/>
  <text x="275" y="146" font-size="15" text-anchor="middle" fill="#ffe2c4">(1, 2, 3)</text>
  <text x="32" y="210" font-size="13" fill="#b8bcc2">имя t ссылается на объект</text>

  <!-- после -->
  <text x="412" y="38" font-size="16" font-weight="600" fill="#e8e8e8">после</text>
  <text x="412" y="58" font-size="13" fill="#9a9fa6">t = (10, 2, 3): создан новый объект</text>
  <rect x="420" y="96" width="80" height="44" rx="8" fill="#1f3350" stroke="#6ea8fe" stroke-width="1.5"/>
  <text x="460" y="124" font-size="15" text-anchor="middle" fill="#cfe2ff">t</text>
  <path d="M500,118 L578,118" fill="none" stroke="#6ea8fe" stroke-width="2" marker-end="url(#nb)"/>
  <rect x="582" y="96" width="130" height="44" rx="8" fill="#4a3320" stroke="#f0a35e" stroke-width="1.5"/>
  <text x="647" y="124" font-size="15" text-anchor="middle" fill="#ffe2c4">(10, 2, 3)</text>

  <path d="M460,140 L460,208 L578,208" fill="none" stroke="#8a8f98" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ng)"/>
  <rect x="582" y="186" width="130" height="44" rx="8" fill="#2c2e31" stroke="#8a8f98" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="647" y="214" font-size="15" text-anchor="middle" fill="#a9aeb5">(1, 2, 3)</text>
  <text x="470" y="236" font-size="12" fill="#a9aeb5">старая ссылка снята</text>
  <text x="412" y="266" font-size="12" fill="#b8bcc2">у старого объекта нет ссылок: его удалит сборщик мусора</text>
</svg>
