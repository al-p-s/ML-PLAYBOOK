<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="qb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9 z" fill="#8a8f98"/></marker>
    <marker id="qo" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#f0a35e"/></marker>
  </defs>
  <rect x="1" y="1" width="758" height="318" rx="16" fill="#232426" stroke="#3a3c40"/>
  <text x="32" y="32" font-size="16" font-weight="600" fill="#e8e8e8">deque: цепочка блоков по 64 ссылки</text>

  <text x="150" y="64" font-size="12" text-anchor="middle" fill="#f5c08f">appendleft / popleft: O(1)</text>
  <text x="610" y="64" font-size="12" text-anchor="middle" fill="#f5c08f">append / pop: O(1)</text>
  <text x="150" y="84" font-size="13" text-anchor="middle" fill="#cfe2ff">левый конец</text>
  <text x="610" y="84" font-size="13" text-anchor="middle" fill="#cfe2ff">правый конец</text>
  <path d="M150,92 L150,134" fill="none" stroke="#f0a35e" stroke-width="2" marker-end="url(#qo)"/>
  <path d="M610,92 L610,134" fill="none" stroke="#f0a35e" stroke-width="2" marker-end="url(#qo)"/>

  <!-- блок 1 -->
  <rect x="60" y="120" width="180" height="60" rx="10" fill="#2c2e31" stroke="#44474c" stroke-width="1.5"/>
  <g stroke="#6fcf97" stroke-width="1.2" stroke-dasharray="3 2" fill="#2c2e31">
    <rect x="68" y="136" width="20" height="28" rx="4"/><rect x="92" y="136" width="20" height="28" rx="4"/><rect x="116" y="136" width="20" height="28" rx="4"/>
  </g>
  <g stroke="#6ea8fe" stroke-width="1.2" fill="#1f3350">
    <rect x="140" y="136" width="20" height="28" rx="4"/><rect x="164" y="136" width="20" height="28" rx="4"/>
    <rect x="188" y="136" width="20" height="28" rx="4"/><rect x="212" y="136" width="20" height="28" rx="4"/>
  </g>

  <!-- блок 2 -->
  <rect x="290" y="120" width="180" height="60" rx="10" fill="#2c2e31" stroke="#44474c" stroke-width="1.5"/>
  <g stroke="#6ea8fe" stroke-width="1.2" fill="#1f3350">
    <rect x="298" y="136" width="20" height="28" rx="4"/><rect x="322" y="136" width="20" height="28" rx="4"/>
    <rect x="346" y="136" width="20" height="28" rx="4"/><rect x="370" y="136" width="20" height="28" rx="4"/>
    <rect x="394" y="136" width="20" height="28" rx="4"/><rect x="418" y="136" width="20" height="28" rx="4"/>
    <rect x="442" y="136" width="20" height="28" rx="4"/>
  </g>

  <!-- блок 3 -->
  <rect x="520" y="120" width="180" height="60" rx="10" fill="#2c2e31" stroke="#44474c" stroke-width="1.5"/>
  <g stroke="#6ea8fe" stroke-width="1.2" fill="#1f3350">
    <rect x="528" y="136" width="20" height="28" rx="4"/><rect x="552" y="136" width="20" height="28" rx="4"/>
    <rect x="576" y="136" width="20" height="28" rx="4"/><rect x="600" y="136" width="20" height="28" rx="4"/>
  </g>
  <g stroke="#6fcf97" stroke-width="1.2" stroke-dasharray="3 2" fill="#2c2e31">
    <rect x="624" y="136" width="20" height="28" rx="4"/><rect x="648" y="136" width="20" height="28" rx="4"/><rect x="672" y="136" width="20" height="28" rx="4"/>
  </g>

  <path d="M244,150 L286,150" fill="none" stroke="#8a8f98" stroke-width="2" marker-start="url(#qb)" marker-end="url(#qb)"/>
  <path d="M474,150 L516,150" fill="none" stroke="#8a8f98" stroke-width="2" marker-start="url(#qb)" marker-end="url(#qb)"/>

  <g font-size="12" text-anchor="middle" fill="#9a9fa6">
    <text x="150" y="204">блок 1 · 64 ссылки</text>
    <text x="380" y="204">блок 2 · 64 ссылки</text>
    <text x="610" y="204">блок 3 · 64 ссылки</text>
  </g>

  <text x="32" y="250" font-size="13" fill="#b8bcc2">d[i]: формулы адреса нет, до нужного блока идут по цепочке от ближнего конца: O(n), у краёв O(1).</text>
  <text x="32" y="272" font-size="13" fill="#b8bcc2">Внутри блока ссылки лежат подряд: мало служебных указателей на элемент, хорошо для кэша процессора.</text>
  <text x="32" y="294" font-size="12" fill="#9a9fa6">Пунктир: свободные ячейки на краях, куда дописываются новые элементы.</text>
</svg>
