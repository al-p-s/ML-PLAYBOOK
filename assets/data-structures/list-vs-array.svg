<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="lb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6ea8fe"/></marker>
  </defs>
  <rect x="1" y="1" width="758" height="388" rx="16" fill="#232426" stroke="#3a3c40"/>

  <text x="32" y="38" font-size="16" font-weight="600" fill="#e8e8e8">list</text>
  <text x="72" y="38" font-size="13" fill="#9a9fa6">подряд лежат ссылки по 8 байт, объекты лежат где-то отдельно</text>

  <g stroke="#6ea8fe" stroke-width="1.5" fill="#1f3350">
    <rect x="40"  y="56" width="84" height="50" rx="8"/>
    <rect x="130" y="56" width="84" height="50" rx="8"/>
    <rect x="220" y="56" width="84" height="50" rx="8"/>
    <rect x="310" y="56" width="84" height="50" rx="8"/>
  </g>
  <g text-anchor="middle" font-size="14" fill="#cfe2ff">
    <text x="82" y="76">ref 0</text><text x="172" y="76">ref 1</text>
    <text x="262" y="76">ref 2</text><text x="352" y="76">ref 3</text>
  </g>
  <g text-anchor="middle" font-size="12" fill="#8fb4e8">
    <text x="82" y="95">A</text><text x="172" y="95">A + 8</text>
    <text x="262" y="95">A + 16</text><text x="352" y="95">A + 24</text>
  </g>

  <g fill="none" stroke="#6ea8fe" stroke-width="1.8" marker-end="url(#lb)">
    <path d="M82,106 L82,168"/>
    <path d="M172,106 C172,140 225,140 225,168"/>
    <path d="M262,106 C262,140 380,140 380,168"/>
    <path d="M352,106 C352,140 510,140 510,168"/>
  </g>

  <g stroke="#f0a35e" stroke-width="1.5" fill="#4a3320">
    <rect x="40"  y="170" width="84"  height="40" rx="8"/>
    <rect x="150" y="170" width="150" height="40" rx="8"/>
    <rect x="330" y="170" width="100" height="40" rx="8"/>
    <rect x="460" y="170" width="100" height="40" rx="8"/>
  </g>
  <g text-anchor="middle" font-size="14" fill="#ffe2c4">
    <text x="82"  y="195">int 5</text>
    <text x="225" y="195">str 'hello world'</text>
    <text x="380" y="195">list [1, 2]</text>
    <text x="510" y="195">float 3.14</text>
  </g>
  <text x="590" y="195" font-size="12" fill="#9a9fa6">объекты разного размера</text>

  <line x1="32" y1="238" x2="728" y2="238" stroke="#3a3c40"/>

  <text x="32" y="268" font-size="16" font-weight="600" fill="#e8e8e8">array.array / NumPy</text>
  <text x="196" y="268" font-size="13" fill="#9a9fa6">подряд лежат сами значения одного типа</text>
  <g stroke="#6fcf97" stroke-width="1.5" fill="#1d3a2b">
    <rect x="40"  y="284" width="84" height="44" rx="8"/>
    <rect x="130" y="284" width="84" height="44" rx="8"/>
    <rect x="220" y="284" width="84" height="44" rx="8"/>
    <rect x="310" y="284" width="84" height="44" rx="8"/>
  </g>
  <g text-anchor="middle" font-size="15" fill="#d5f5e3">
    <text x="82" y="312">5</text><text x="172" y="312">7</text>
    <text x="262" y="312">9</text><text x="352" y="312">11</text>
  </g>

  <text x="32" y="356" font-size="13" fill="#b8bcc2">Адрес i-го элемента: A + i · размер_элемента, поэтому lst[i] это O(1).</text>
  <text x="32" y="376" font-size="13" fill="#9a9fa6">У list размер ссылки всегда один и тот же, и формула работает для любых объектов.</text>
</svg>
